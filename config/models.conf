# Tier -> model binding. THE single rebind point for this harness.
#
# Prose names a TIER. Executable config needs a literal model name, because no
# resolver understands a tier name. `harness install` reads this file and writes
# the literal into the {{TIER_*}} tokens in the shipped agent definitions.
#
# When a new model ships, change the value here and nothing else. If something
# ships ABOVE the current frontier, add a tier rather than promoting everything.
#
# Tiers are defined by capability in AGENTS.md, so a future model slots in by
# description rather than by name:
#
#   FRONTIER_THINK  what is really going on, and what should this be?
#                   first-principles analysis, root-causing an unexplained
#                   failure, greenfield design, synthesising many inputs
#   FRONTIER_DO     is this actually right, and will it hold?
#                   correctness-critical implementation, adversarial review,
#                   long autonomous runs
#   MID             implementation against a pattern already in the repo,
#                   frontends, wiring, tests, prose
#   SMALL           extraction, classification, mechanical grind a test proves

TIER_FRONTIER_THINK=fable
TIER_FRONTIER_DO=opus
TIER_MID=sonnet
TIER_SMALL=haiku
