# Files the harness USED to install at user scope and no longer ships.
#
# `harness install --user` records what it installs in ~/.claude/.harness-manifest
# and retires anything a later run drops. This file covers the era BEFORE that
# manifest existed: these were installed by a harness that kept no record, so
# the first manifest-aware run has no other way to know they are ours.
#
# Why it matters: put() adds and replaces but never removed, so the rename from
# model-named agents to job-named ones left both live on every machine that had
# the old set. The same agent under two names means a plan written against
# either one "works", and nothing ever says which definition a dispatch hit.
#
# Retiring MOVES a file into ~/.claude/backups/harness-retired-<timestamp>/ and
# reports it. Nothing is deleted, and a file the harness never installed is
# never touched.
#
# This file names literal model names because the filenames did. That is why
# verify.sh check 2 exempts this exact path, the same way it exempts
# config/models.conf: a binding, not prose. Do not add anything here that is not
# genuinely a path the harness once wrote.
#
# FORMAT: one path per line, relative to ~/.claude. Comments with #.
# Once every machine you care about has run a manifest-aware install, a line
# here is dead weight and can go.

# The agent rename: model-named -> job-named. See adapters/README.md for the
# mapping and for why an agent name is an opaque identifier.
agents/exec-haiku-medium.md
agents/exec-sonnet-medium.md
agents/exec-opus-high.md
agents/exec-opus-max.md
agents/opus-adversary.md
agents/fable-master-planner.md
agents/fable-reviewer.md

# The harness shipped its own simplify skill, which duplicated a command the
# host already provides under the same name. Replaced by /ponytail-review from
# the ponytail plugin; see config/upstream.conf.
skills/simplify/SKILL.md
