# External reviewer binding. Same KEY=value shape as models.conf: strip from the
# first `#` onward, strip whitespace, done.
#
# The external review gate exists to get a second opinion from a DIFFERENT model
# family. A reviewer from the same family as the author shares its blind spots,
# so the gate looks like it ran and finds nothing. That is the only thing this
# file is protecting.
#
# REVIEWER_CLI   which command line tool drives the review. One of:
#                auggie, codex, cursor-agent, gemini. The CLI is not the family:
#                every one of these can serve a same-family model, which is why
#                the model is bound separately below.
#
# REVIEWER_MODEL the literal model id to pin. EMPTY means discover it via
#                `scripts/resolve-tier.sh REVIEWER`, which asks the vendor for
#                the account's model list and applies the non-same-family rule
#                (preference order: Astra, then Sol). Set a literal here to pin
#                one instead; the runbook step that probes the work machine
#                records the exact literal the CLI accepts, which is not
#                guaranteed to equal the display name in the picker.
#
#                Discovery is implemented for auggie only. With any other CLI an
#                empty value is UNAVAILABLE, never the CLI's own default model:
#                that default is a same-family model on more than one of these
#                tools, and taking it would silently gut the gate.
#
# Both are overridable by the environment (REVIEWER_CLI, REVIEWER_MODEL), which
# is how a machine with a different tool installed runs against a shipped conf
# it does not want to edit.

REVIEWER_CLI=auggie
REVIEWER_MODEL=
