# Upstream sources this harness references but does NOT vendor.
#
# THE RULE: a skill, agent or command that comes from a GitHub repository is
# referenced here, not copied in. A copy is a fork you did not mean to make. It
# freezes at the moment you took it, silently misses every improvement upstream
# ships, and the person reading it cannot tell which parts are the author's and
# which are ours.
#
# So the harness clones each repo below to `.upstream/<name>/` (gitignored) and
# leaves it as the author wrote it. Nothing pre-converts it. Your coding tool
# reads the clone and installs or adapts what it needs into its own framework,
# because Claude Code, Auggie and the rest each want a different shape and the
# tool knows its own shape better than a conversion script does.
#
# Refresh with:  harness upstream
# Read the policy in: docs/upstream-sources.md
#
# FORMAT: one entry per line, whitespace separated.
#   <name> <clone-url> <ref> [install]
# `name` is the directory under `.upstream/`. `ref` is the branch to track;
# `main` means "track what upstream ships", which is the point of this file.
# Pin a tag or SHA instead only when you have a reason, and write the reason
# above the line.
#
# `install` is optional and says which SKILLS `harness install --user` should
# deploy from that clone. Omit it and the clone is reference material only: it
# gets cloned for a tool or a person to read, and nothing is installed.
#   install=*                 every skill the repo ships
#   install=a,b,c             only these, by their frontmatter `name:`
# Two repo shapes are handled. A repo whose root holds a SKILL.md IS one skill,
# named by that file's frontmatter. A repo with a `skills/<name>/SKILL.md` tree
# ships several. You do not have to say which shape; the installer looks.
#
# An upstream skill OVERRIDES a harness skill of the same name, and the install
# says so on the line it prints. That is the point of skills/THIRD_PARTY.md:
# where a pinned snapshot and its upstream disagree, upstream is right about
# the author's intent.

# Jesse Vincent's (obra) skill collection. Provides the brainstorming,
# requesting-code-review, systematic-debugging and test-driven-development
# skills. Four pinned snapshots of these still live in skills/ as an offline
# fallback; skills/THIRD_PARTY.md records that and how they get retired.
superpowers https://github.com/obra/superpowers main install=brainstorming,requesting-code-review,systematic-debugging,test-driven-development

# ponytail. Provides /ponytail-review, which is STEP 3 OF THE PER-WAVE GATE
# STACK, so this one is load-bearing rather than a convenience. It also
# provides the `ponytail:` comment convention this repo uses to mark a
# deliberate shortcut (docs/writing-your-own.md).
#
# The harness used to ship its own skills/simplify/ for that step. Two things
# were wrong with it: it duplicated a command the host already provides under
# the same name, so it is unclear which one ever ran; and it was a
# reimplementation of this project that could not receive its improvements.
# Deleted in favour of the real thing.
ponytail https://github.com/DietrichGebert/ponytail main install=*

# humanizer. Provides a skill that rewrites AI-sounding prose so it reads as
# written by a person, based on Wikipedia's "Signs of AI writing". This one is
# load-bearing for a rule the harness already enforces: AGENTS.md requires that
# anything a third party reads must not read as machine-written, and verify.sh
# check 8 can only police the CHARACTERS that habit leaves behind, never the
# habit. A repo that bans the em dash and then substitutes a spaced hyphen
# everywhere has changed the glyph and kept the rhythm, and only a reader
# looking for the pattern catches that. It runs entirely through the agent, so
# no document leaves the machine to be rewritten.
humanizer https://github.com/blader/humanizer main install=*

# Joanium's skill collection. Reference only, deliberately: it is over six
# thousand flat .md files in one directory, with a frontmatter shape
# (name/trigger/description, a display name with a space) that does not match
# this repo's skill contract, and no skills/<name>/SKILL.md tree for the
# installer to find. So there is no install= here and there should not be one.
# One skill was taken from it by hand and converted: skills/grill-me/, recorded
# in skills/THIRD_PARTY.md. Apache-2.0.
joanium-skills https://github.com/Joanium/Skills main

# notebooklm-py. Provides the notebooklm skill: Gemini Notebook automation
# through a CLI and a typed async Python API. Installed on the maintainer's
# machine and absent from this repo, which is the gap this manifest exists to
# close.
notebooklm-py https://github.com/teng-lin/notebooklm-py main install=*

# graphify. Provides the graphify skill: turns a folder into a navigable
# knowledge graph, with a references/ directory of sub-procedures. The skill
# also installs a PyPI package, `graphifyy`, which is what actually runs; this
# repo is the source the tool should read to understand it. The URL is the
# Repository field from graphifyy 0.9.53's own package metadata, not a guess:
# the skill file itself names no repo, and an older personal location
# (safishamsi/graphify) appears in the package description.
graphify https://github.com/Graphify-Labs/graphify main install=*
